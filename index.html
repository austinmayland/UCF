<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UCF Power Rankings</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: flat black masthead, week chips, podium for the top three, then tabbed analysis. Neutral graphite palette with one steel-blue accent. */
:root{
  --bg:#f4f4f5; --surface:#ffffff; --surface2:#f8f8f9; --fg:#18181b; --muted:#6b6b73; --line:#e4e4e7;
  --accent:#2f5d8a; --gold:#a37b1a; --silver:#71717a; --bronze:#9a6238; --up:#1d7a4b; --down:#b3382c;
  --hero:#111113; --hero-fg:#f4f4f5; --hero-line:#ffffff24; --chart-l:42%;
  --f-display:Calibri,Carlito,'Segoe UI',Arial,sans-serif; --f-body:Calibri,Carlito,'Segoe UI',Arial,sans-serif; --f-data:Calibri,Carlito,'Segoe UI',Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b0b0c; --surface:#141416; --surface2:#1a1a1d; --fg:#ececee; --muted:#8e8e96; --line:#26262a;
  --accent:#6aa5e0; --gold:#d4a93f; --silver:#a1a1aa; --bronze:#c08457; --up:#4cc38a; --down:#ef6f62;
  --hero:#000000; --hero-fg:#ececee; --hero-line:#ffffff24; --chart-l:64%; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b0b0c; --surface:#141416; --surface2:#1a1a1d; --fg:#ececee; --muted:#8e8e96; --line:#26262a;
  --accent:#6aa5e0; --gold:#d4a93f; --silver:#a1a1aa; --bronze:#c08457; --up:#4cc38a; --down:#ef6f62;
  --hero:#000000; --hero-fg:#ececee; --hero-line:#ffffff24; --chart-l:64%; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0}
.podium{margin-top:20px}
nav{scrollbar-width:none}nav::-webkit-scrollbar{display:none}
nav button{padding:8px 12px}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.45;font-variant-numeric:tabular-nums;padding-block:0 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.hero{margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:28px max(16px,env(safe-area-inset-left,0px)) 22px;background:var(--hero);color:var(--hero-fg);border-bottom:1px solid var(--line)}
.hero-in{max-width:1120px;margin:0 auto;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:16px}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(34px,5.5vw,52px);line-height:1;letter-spacing:.02em;text-transform:uppercase;text-wrap:balance}
h1 small{display:block;font-size:.26em;font-weight:500;letter-spacing:.2em;opacity:.65;margin-top:10px;font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chips .lbl{font-size:11px;letter-spacing:.16em;text-transform:uppercase;opacity:.7;margin-right:4px}
.chip{font-family:var(--f-display);font-weight:600;font-size:17px;letter-spacing:.04em;min-width:42px;padding:3px 10px;border-radius:5px;border:1px solid var(--hero-line);background:transparent;color:var(--hero-fg);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--hero-fg);color:var(--hero);border-color:var(--hero-fg)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.podium{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.pod{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px;display:flex;gap:12px;align-items:center;min-width:0;border-top:3px solid var(--c)}
.pod .n{font-family:var(--f-display);font-weight:700;font-size:46px;line-height:1;color:var(--c)}
.pod .nm{font-family:var(--f-display);font-weight:700;font-size:23px;line-height:1.05;overflow-wrap:anywhere}
.pod .m{font-family:var(--f-data);font-size:12px;color:var(--muted);margin-top:2px}
.pod:nth-child(1){--c:var(--gold)}.pod:nth-child(2){--c:var(--silver)}.pod:nth-child(3){--c:var(--bronze)}
.av{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:15px;color:#fff;background:hsl(var(--h) 24% 34%)}
.av.lg{width:52px;height:52px;font-size:22px}
nav{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto}
nav button{font-family:var(--f-display);font-size:19px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;background:none;border:0;border-bottom:3px solid transparent;color:var(--muted);padding:8px 14px;cursor:pointer;white-space:nowrap}
nav button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;min-width:0}
.scroll{overflow-x:auto}
.ph{display:flex;flex-wrap:wrap;gap:8px 16px;justify-content:space-between;align-items:center;padding:12px 16px 4px}
.ph h2{font-family:var(--f-display);font-size:22px;font-weight:700;letter-spacing:.05em;text-transform:uppercase}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:500;text-align:left;padding:10px 12px;white-space:nowrap}
td{padding:9px 12px;border-top:1px solid var(--line);white-space:nowrap}
th.n,td.n{text-align:right}
tr.row{cursor:pointer}
tr.row:hover td{background:var(--surface2)}
tr.sel td{background:color-mix(in srgb,var(--accent) 11%,var(--surface))}
.rk{font-family:var(--f-display);font-weight:700;font-size:28px;line-height:1;width:46px}
.tm{display:flex;align-items:center;gap:10px}
.tn{font-family:var(--f-display);font-weight:600;font-size:21px;letter-spacing:.02em}
.mono{font-family:var(--f-data);font-size:15px}
.sub{color:var(--muted);font-size:12px;margin-left:4px;font-family:var(--f-data)}
.d{font-family:var(--f-data);font-size:12px}.d.up{color:var(--up)}.d.dn{color:var(--down)}.d.eq{color:var(--muted)}
.pos{color:var(--up)}.neg{color:var(--down)}
.bar{display:inline-block;width:84px;height:8px;border-radius:4px;background:var(--line);vertical-align:middle;margin-left:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:4px}
.note{font-size:12px;color:var(--muted);padding:10px 16px;border-top:1px solid var(--line)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;padding:12px 16px 16px}
.tile{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
.tile .l{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.tile .v{font-family:var(--f-display);font-weight:700;font-size:26px;line-height:1.1;overflow-wrap:anywhere}
.tile .s{font-size:12px;color:var(--muted);font-family:var(--f-data)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{font:inherit;font-size:13px;padding:5px 12px;background:var(--surface);color:var(--muted);border:0;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--surface);font-weight:600}
svg text{fill:var(--muted);font-family:var(--f-data);font-size:11px}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;padding:4px 16px 12px}
.legend button{background:none;border:0;color:var(--fg);font:inherit;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:6px;padding:2px 0}
.legend i{width:14px;height:4px;border-radius:2px;display:inline-block}
.heat{text-align:center;font-family:var(--f-data);font-size:13px;min-width:86px}
.heat b{font-weight:600;color:var(--fg)}
.rb{display:inline-block;width:14px;font-weight:700;font-size:12px;color:var(--muted)}.rb.w{color:var(--up)}.rb.l{color:var(--down)}
html{scrollbar-gutter:stable;overflow-y:scroll}
#view{min-height:75vh}
.mu{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px;padding:12px 16px 16px}
.card{background:var(--surface2);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.side{display:flex;align-items:center;gap:10px;padding:10px 12px}
.side+.side{border-top:1px solid var(--line)}
.side .tn{flex:1;min-width:0;font-size:19px}
.side .sc{font-family:var(--f-data);font-size:15px;font-weight:500}
.side.lose{opacity:.55}
.side.win .sc{font-weight:600}
.side .mk{width:18px;font-family:var(--f-display);font-weight:700;color:var(--up)}
.card .ft{font-size:11px;color:var(--muted);padding:5px 12px;border-top:1px solid var(--line);font-family:var(--f-data)}
.mth{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px;padding:12px 16px 18px}
.slider{display:grid;grid-template-columns:150px 1fr 38px;gap:10px;align-items:center;padding:6px 16px;font-size:14px}
.slider input{width:100%;accent-color:var(--accent)}
select,input[type=number],input[type=text]{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:5px 7px}
.btn{font:inherit;font-size:13px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 12px;cursor:pointer;color:var(--fg)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--surface);font-weight:600}
.tools{display:flex;flex-wrap:wrap;gap:8px;padding:12px 16px;align-items:center}
.dt input[type=number]{width:62px;padding:3px 4px;font-family:var(--f-data);font-size:12px;text-align:right}
.dt input.nm{width:150px;font-weight:600}
.dt select{padding:2px;font-size:11px;width:62px;margin-top:3px;display:block}
.dt td,.dt th{padding:6px 5px}
textarea{width:calc(100% - 32px);margin:0 16px 12px;min-height:90px;font-family:var(--f-data);font-size:11px;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:8px}
.formula{font-family:var(--f-data);font-size:12px;background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;line-height:1.7}
.p{padding:0 16px;font-size:14px;color:var(--muted)}
@media (max-width:640px){.podium{grid-template-columns:1fr}.slider{grid-template-columns:110px 1fr 34px}}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .3s}}
</style>

</head>
<body>
<div class="hero"><div class="hero-in">
  <h1>UCF Power Rankings<small>FOOTBALL (NOT REALLY THOUGH) &#xb7; 2026</small></h1>
  <div class="chips" id="chips"></div>
</div></div>
<div class="wrap">
  <section class="podium" id="podium"></section>
  <nav role="tablist" id="tabs"></nav>
  <main id="view"></main>
</div>

<script>
var WEEKS = 17, KEY = 'ucf-power-2026-v3';
var TABS = [['rank','Power rankings'],['match','Matchups'],['trend','Trends'],['outlook','Outlook'],['comm','Week 6 intel'],['scores','Results'],['method','Method']];
var tab='rank', hl=null, asof=0, trendMode='rank';
var DEF_W = {ap:3, ppg:2.5, form:1.5, rec:1.5, win:3, spots:6, reg:14};

/* ---------- 2026 data: [points, opponent index] per week ---------- */
var NAMES = ['Kenny Keller','Austin Mayland','Edsall Hilty','Bryan Rosen','Matt Ender','Jordan Schneider','Jordan Lande','Jorge Fernandez','Andrew Goldsmith','Dean Mizrahi'];
var PTS = [ /* weeks 1-6, in NAMES order */
 [124.72,161.42,144.76,149.96,139.66,104.7,164.14],
 [164.46,151.14,133.38,213.58,133.74,134.6,140.72],
 [160.36,121.12,127.5,154.94,162.14,145.84,125.62],
 [200.1,149.26,156.4,89.3,141.24,110.32,172.68],
 [159.5,114.76,143.54,151.06,153.54,145.14,115.72],
 [96.64,135.08,146.28,148.82,115.26,150.06,131.12],
 [105.96,106.08,134.88,141.02,147.0,111.84,125.06],
 [150.62,118.16,90.12,113.6,159.0,110.48,127.52],
 [148.26,186.22,153.16,116.42,105.78,100.6,119.5],
 [146.06,71.1,128.14,148.08,133.72,112.88,122.4]];
var PAIRS = [ /* matchups by name index per week */
 [[7,1],[4,5],[8,2],[0,6],[3,9]],
 [[9,1],[8,4],[5,0],[2,3],[6,7]],
 [[1,2],[4,0],[3,8],[7,5],[9,6]],
 [[8,1],[3,4],[0,7],[5,9],[2,6]],
 [[1,3],[4,7],[9,0],[6,8],[2,5]],
 [[1,4],[7,9],[3,6],[0,2],[8,5]],
 [[9,4],[1,6],[7,2],[3,5],[0,8]]];
function realData(){
  var teams = NAMES.map(function(n,i){
    var sc=[],op=[]; for (var w=0;w<WEEKS;w++){ sc.push(PTS[i][w]===undefined?null:PTS[i][w]); op.push(null); }
    return {id:'t'+i, name:n, scores:sc, opp:op};
  });
  PAIRS.forEach(function(wk,w){ wk.forEach(function(p){ teams[p[0]].opp[w]='t'+p[1]; teams[p[1]].opp[w]='t'+p[0]; }); });
  return {teams:teams, w:JSON.parse(JSON.stringify(DEF_W))};
}
var state = realData();
try { var raw=localStorage.getItem(KEY); var sw = raw?JSON.parse(raw):null; if (sw && sw.ap!==undefined) state.w = Object.assign({}, DEF_W, sw); } catch(e){}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(state.w)); } catch(e){} }

/* ---------- model ---------- */
function num(x){ return (x===null||x===''||x===undefined||isNaN(Number(x)))?null:Number(x); }
function byId(id){ return state.teams.filter(function(t){return t.id===id;})[0]; }
function lastWeek(){ var l=0; state.teams.forEach(function(t){ t.scores.forEach(function(s,i){ if (num(s)!==null && i+1>l) l=i+1; }); }); return l; }
function mean(a){ return a.length? a.reduce(function(x,y){return x+y;},0)/a.length : 0; }
function zs(v){ var m=mean(v), sd=Math.sqrt(mean(v.map(function(x){return (x-m)*(x-m);}))); return v.map(function(x){ return sd? (x-m)/sd : 0; }); }
function rankDesc(v){ return v.map(function(x){ return 1+v.filter(function(y){return y>x;}).length; }); }
function game(t,k){ /* result of week k (0-based): {opp,us,them,res} */
  var s=num(t.scores[k]); if (s===null) return null;
  var o=t.opp[k]?byId(t.opp[k]):null, os=o?num(o.scores[k]):null;
  var res = (os===null)?null:(s>os?1:(s<os?0:0.5));
  return {s:s, opp:o, os:os, res:res};
}
function compute(w){
  var T=state.teams, N=T.length, W=state.w;
  var rows=T.map(function(t,i){
    var sc=[],wins=0,loss=0,ties=0,pa=0,played=0,apw=0,apl=0;
    for (var k=0;k<w;k++){
      var g=game(t,k); if (!g) continue; sc.push(g.s);
      if (g.res!==null){ played++; pa+=g.os; if (g.res===1) wins++; else if (g.res===0) loss++; else ties++; }
      T.forEach(function(o){ if (o===t) return; var os=num(o.scores[k]); if (os===null) return; if (os<g.s) apw++; else if (os>g.s) apl++; else {apw+=0.5; apl+=0.5;} });
    }
    var n=sc.length, fw=Math.max(2,Math.min(5,W.win|0)), fs=sc.slice(-fw);
    var apPct = (apw+apl)? apw/(apw+apl):0;
    return {i:i,id:t.id,name:t.name,g:n,played:played,wins:wins,loss:loss,ties:ties,pf:sc.reduce(function(a,b){return a+b;},0),pa:pa,
      avg:mean(sc),sd:Math.sqrt(mean(sc.map(function(x){return (x-mean(sc))*(x-mean(sc));}))),form:mean(fs),high:n?Math.max.apply(null,sc):0,low:n?Math.min.apply(null,sc):0,apw:apw,apl:apl,apPct:apPct,
      recPct:played?(wins+ties/2)/played:0, luck:(wins+ties/2)-apPct*played};
  });
  var zA=zs(rows.map(function(r){return r.apPct;})), zP=zs(rows.map(function(r){return r.avg;})), zF=zs(rows.map(function(r){return r.form;})), zR=zs(rows.map(function(r){return r.recPct;}));
  var ws=W.ap+W.ppg+W.form+W.rec||1;
  rows.forEach(function(r,k){ r.rating = 50+15*((zA[k]*W.ap+zP[k]*W.ppg+zF[k]*W.form+zR[k]*W.rec)/ws); });
  /* original method for comparison */
  var rec=rankDesc(rows.map(function(r){return r.wins+r.ties/2;})), ow=rankDesc(rows.map(function(r){return r.apw;})), pp=rankDesc(rows.map(function(r){return r.avg;}));
  var lg=mean(rows.map(function(r){return r.avg;}));
  var cons=rows.map(function(r,k){ var sd=0,m=r.avg,c=0; for (var q=0;q<w;q++){ var s=num(T[k].scores[q]); if (s!==null){ sd+=(s-m)*(s-m); c++; } } sd=c?Math.sqrt(sd/c):0; return r.avg-3*sd-0.75*lg; });
  var cn=rankDesc(cons), wRec=Math.min(1.2*w,3), wCons=w<3?0:1, wSum=wRec+1+wCons+1;
  rows.forEach(function(r,k){ r.oldScore=(rec[k]*wRec+ow[k]+cn[k]*wCons+pp[k])/wSum; });
  var oo=rows.slice().sort(function(a,b){return a.oldScore-b.oldScore||b.avg-a.avg;}); oo.forEach(function(r,k){ r.oldRank=k+1; });
  var ord=rows.slice().sort(function(a,b){return b.rating-a.rating||b.avg-a.avg;}); ord.forEach(function(r,k){ r.power=k+1; });
  return {rows:ord, lgAvg:lg};
}
var cache={};
function at(w){ if(!cache[w]) cache[w]=compute(w); return cache[w]; }
function rowOf(w,i){ return at(w).rows.filter(function(r){return r.i===i;})[0]; }
function delta(r,w){ if (w<2) return null; return rowOf(w-1,r.i).power - r.power; }

/* ---------- helpers ---------- */
function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function f1(x){ return (Math.round(x*10)/10).toFixed(1); }
function f2(x){ return (Math.round(x*100)/100).toFixed(2); }
function hue(i){ return Math.round(i*360/Math.max(state.teams.length,1)+14)%360; }
function col(i){ return 'hsl('+hue(i)+' 62% var(--chart-l))'; }
function ini(n){ var p=n.trim().split(/\s+/); return (p[0][0]||'')+((p[1]||'')[0]||''); }
function short(n){ var p=n.trim().split(/\s+/); return p.length>1? p[0]+' '+p[p.length-1][0]+'.' : n; }
function av(i,lg){ return '<span class="av'+(lg?' lg':'')+'" style="--h:'+hue(i)+'">'+esc(ini(state.teams[i].name))+'</span>'; }
function rec(r){ return r.played? r.wins+'-'+r.loss+(r.ties?'-'+r.ties:'') : '\u2013'; }
function sgn(x){ return (x>0?'+':'')+f1(x); }
function dHtml(d){ if (d===null) return '<span class="d eq">\u2013</span>'; if (d>0) return '<span class="d up">\u25b2 '+d+'</span>'; if (d<0) return '<span class="d dn">\u25bc '+(-d)+'</span>'; return '<span class="d eq">\u2013</span>'; }
function spark(i,w){
  var v=[]; for (var k=0;k<w;k++){ var s=num(state.teams[i].scores[k]); if (s!==null) v.push(s); }
  if (v.length<2) return '';
  var lo=Math.min.apply(null,v), hi=Math.max.apply(null,v), W=84, H=24, rng=(hi-lo)||1;
  var pts=v.map(function(x,k){ return (3+(W-6)*k/(v.length-1)).toFixed(1)+','+(H-3-(H-6)*(x-lo)/rng).toFixed(1); });
  var lp=pts[pts.length-1].split(',');
  return '<svg width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'" aria-hidden="true"><polyline fill="none" stroke="'+col(i)+'" stroke-width="2" points="'+pts.join(' ')+'"/><circle cx="'+lp[0]+'" cy="'+lp[1]+'" r="3" fill="'+col(i)+'"/></svg>';
}

/* ---------- views ---------- */
function renderChips(){
  var last=lastWeek(), h='<span class="lbl">As of week</span>';
  for (var k=1;k<=Math.max(last,1);k++) h+='<button class="chip" data-wk="'+k+'" aria-pressed="'+(asof===k)+'">'+k+'</button>';
  document.getElementById('chips').innerHTML=h;
}
function renderPodium(w){
  var el=document.getElementById('podium');
  if(!w){ el.innerHTML=''; return; }
  el.innerHTML=at(w).rows.slice(0,3).map(function(r){
    return '<div class="pod"><div class="n">'+r.power+'</div>'+av(r.i)+'<div style="min-width:0"><div class="nm">'+esc(r.name)+'</div><div class="m">'+f1(r.rating)+' rating \u00b7 '+rec(r)+' \u00b7 '+f1(r.avg)+' ppg</div></div></div>';
  }).join('');
}
function vRank(w){
  if(!w) return '<div class="panel"><div class="note">No scores yet. Add week 1 on the Data tab.</div></div>';

function vNotes(w){

  var big=dec.slice().sort(function(a,b){return (b.g.s-b.g.os)-(a.g.s-a.g.os);})[0], close=dec.slice().sort(function(a,b){return (a.g.s-a.g.os)-(b.g.s-b.g.os);})[0];

function vMatch(w){

function vTrend(w){

  var x=function(k){ return w===1?L+(W-L-R)/2:L+(W-L-R)*k/(w-1); };
  var y=function(r){ return mode==='rank'? T+(H-T-B)*(r.power-1)/Math.max(N-1,1) : T+(H-T-B)*(1-(r.rating-rmin)/((rmax-rmin)||1)); };

  s+='</svg>';
  var leg='<div class="legend">'+state.teams.map(function(t,i){ return '<button data-t="'+i+'"'+(hl===i?' style="font-weight:600"':'')+'><i style="background:'+col(i)+'"></i>'+esc(short(t.name))+'</button>'; }).join('')+'</div>';

function rng(seed){ return function(){ seed|=0; seed=seed+0x6D2B79F5|0; var t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function vOutlook(w){
  if(!w) return '<div class="panel"><div class="note">Outlook appears after week 1.</div></div>';
  var W=state.w, R=Math.max(W.reg,w), N=state.teams.length, spots=Math.min(W.spots,N), rows=at(w).rows, SIMS=4000, rand=rng(2026+w);
  function norm(){ var u=0,v=0; while(!u) u=rand(); while(!v) v=rand(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); }
  var lgsd=Math.sqrt(mean(rows.map(function(r){return r.sd*r.sd;}))) || 25;
  var mu=rows.map(function(r){ return 0.65*r.avg+0.35*r.form; });
  var sd=rows.map(function(r){ return Math.sqrt(0.5*r.sd*r.sd+0.5*lgsd*lgsd); });
  var pf0=rows.map(function(r){return r.pf;}), w0=rows.map(function(r){return r.wins+r.ties/2;});
  var po=rows.map(function(){return 0;}), top=rows.map(function(){return 0;}), sumW=rows.map(function(){return 0;}), dist=rows.map(function(){return [];});
  var idx=rows.map(function(_,k){return k;});

    for (var wk=w; wk<R; wk++){
      for (var a=N-1;a>0;a--){ var b=Math.floor(rand()*(a+1)), tmp=idx[a]; idx[a]=idx[b]; idx[b]=tmp; }
      var sc=[]; for (var q=0;q<N;q++) sc[q]=mu[q]+sd[q]*norm();
      for (var p=0;p+1<N;p+=2){ var i=idx[p], j=idx[p+1]; pf[i]+=sc[i]; pf[j]+=sc[j]; if (sc[i]>sc[j]) win[i]++; else win[j]++; }
    }
    var ord=idx.slice().sort(function(x,y){ return win[y]-win[x]||pf[y]-pf[x]; });
    ord.forEach(function(t,pos){ if(pos<spots) po[t]++; if(pos===0) top[t]++; });
    for (var t2=0;t2<N;t2++){ sumW[t2]+=win[t2]; dist[t2].push(win[t2]); }
  }
  var out=rows.map(function(r,k){ var d=dist[k].slice().sort(function(a,b){return a-b;}); return {r:r,po:po[k]/SIMS,top:top[k]/SIMS,ew:sumW[k]/SIMS,lo:d[Math.floor(SIMS*0.1)],hi:d[Math.floor(SIMS*0.9)]}; });
  out.sort(function(a,b){ return b.po-a.po||b.ew-a.ew; });
  function sl(k,l,min,max){ return '<div class="slider"><label for="s_'+k+'">'+l+'</label><input id="s_'+k+'" type="range" min="'+min+'" max="'+max+'" step="1" value="'+W[k]+'" data-w="'+k+'"><span class="mono" id="v_'+k+'">'+W[k]+'</span></div>'; }
  var h='<div class="panel"><div class="ph"><h2>Season outlook after week '+w+'</h2><span class="sub">'+SIMS+' simulated seasons</span></div><div class="mth" style="padding-bottom:4px"><div>'+sl('spots','Playoff spots',2,Math.max(2,N-1))+'</div><div>'+sl('reg','Regular-season weeks',w,17)+'</div></div><div class="scroll"><table><thead><tr><th>Team</th><th class="n">Now</th><th class="n">Proj. wins</th><th class="n">Range (10-90%)</th><th>Playoff odds</th><th class="n">#1 seed</th><th class="n">Power #</th></tr></thead><tbody>';
  out.forEach(function(o){
    h+='<tr class="row'+(hl===o.r.i?' sel':'')+'" data-t="'+o.r.i+'"><td><div class="tm">'+av(o.r.i)+'<span class="tn">'+esc(o.r.name)+'</span></div></td><td class="n mono">'+rec(o.r)+'</td><td class="n mono">'+f1(o.ew)+'</td><td class="n mono">'+o.lo+' to '+o.hi+'</td>'
     +'<td class="mono">'+Math.round(o.po*100)+'%<span class="bar"><i style="width:'+Math.round(o.po*100)+'%"></i></span></td><td class="n mono">'+Math.round(o.top*100)+'%</td><td class="n mono">'+o.r.power+'</td></tr>';
  });
  return h+'</tbody></table></div><div class="note">Each remaining week, teams are paired at random and each score is drawn from a normal curve centered on 65% season PPG and 35% recent PPG, with spread blended between the team and the league. Seeds go by wins, then points for. The real remaining schedule and playoff format will sharpen this. Treat early-season odds as rough.</div></div>';
}

  if (TXW[w]){
    var rows=TXW[w].map(function(x){
      var f=null; P.forEach(function(p){ if(p.team===x[1]&&p.name===x[2]) f=p; });
      var res=f?(f.slot==='BE'||f.slot==='IR'?'<span class="neg">Benched</span> '+f1(f.act||0)+' pts':'<span class="pos">Started</span> '+f1(f.act||0)+' pts <span class="sub">vs '+f1(f.proj||0)+'</span>'):'<span class="sub">Not on roster</span>';
      return '<tr><td class="mono">'+x[0]+'</td><td>'+esc(x[1])+'</td><td>'+esc(x[2])+'</td><td>'+esc(x[3]||'\u2013')+'</td><td class="n mono">$'+x[4]+'</td><td>'+res+'</td></tr>';
    }).join('');
    h+='<div class="panel" style="margin-top:18px"><div class="ph"><h2>Waiver wire scorecard</h2></div><div class="scroll"><table><thead><tr><th>Date</th><th>Team</th><th>Added</th><th>Dropped</th><th class="n">FAAB</th><th>Week '+w+'</th></tr></thead><tbody>'+rows+'</tbody></table></div><div class="note">Waiver moves processed in the days before the week\'s games. The box score has no in-game injury timing, so a low score is shown against projection without a cause.</div></div>';
  } else {
    h+='<div class="panel" style="margin-top:18px"><div class="note">The waiver wire scorecard is only built for weeks 6 and 7 so far.</div></div>';
  }
  if (TRW[w]){
    function pts(n){ var f=null; P.forEach(function(p){ if(p.name===n) f=p; }); return f?(f.act===null?'n/a':f1(f.act)+(f.slot==='BE'||f.slot==='IR'?' on the bench':'')):'not in a lineup'; }
    var tr=TRW[w].map(function(x){ return '<tr><td class="mono">'+x[0]+'</td><td>'+esc(x[1])+' sent '+x[2].map(function(n){return esc(n)+' <span class="sub">('+pts(n)+')</span>';}).join(', ')+'</td><td>'+esc(x[3])+' sent '+x[4].map(function(n){return esc(n)+' <span class="sub">('+pts(n)+')</span>';}).join(', ')+'</td></tr>'; }).join('');
    h+='<div class="panel" style="margin-top:18px"><div class="ph"><h2>Trades</h2></div><div class="scroll"><table><thead><tr><th>Date</th><th>Side A</th><th>Side B</th></tr></thead><tbody>'+tr+'</tbody></table></div><div class="note">Points are the player\'s week '+w+' score on his new team.</div></div>';
  }
  return h;
}
function vMethod(){
  var W=state.w;
  function S(k,l,min,max,step){ return '<div class="slider"><label for="s_'+k+'">'+l+'</label><input id="s_'+k+'" type="range" min="'+min+'" max="'+max+'" step="'+step+'" value="'+W[k]+'" data-w="'+k+'"><span class="mono" id="v_'+k+'">'+W[k]+'</span></div>'; }
  return '<div class="panel"><div class="ph"><h2>How the rating works</h2><button class="btn" id="wReset">Reset weights</button></div>'
   +'<div class="mth"><div><p class="p" style="padding:0 0 10px">Each team is scored against the other nine on four measures. Every measure is converted to a z-score, so a 10-point scoring edge counts for more than a 1-point edge. The weighted average is rescaled so 50 is the league average and 15 points is one standard deviation.</p>'
   +'<div class="formula">Rating = 50 + 15 \u00d7 \u03a3(weight \u00d7 z) \u00f7 \u03a3 weight<br>All-play win %: share of every other team\'s score you beat each week<br>Season PPG: average points per game<br>Recent PPG: average of the last N weeks<br>Record: win % in actual matchups<br>Ties in rating break on season PPG</div></div>'
   +'<div><p class="p" style="padding:0 0 6px">Adjust the weights to see how the order moves. Changes apply immediately and stay in this browser.</p>'
   +S('ap','All-play win %',0,5,0.5)+S('ppg','Season PPG',0,5,0.5)+S('form','Recent PPG',0,5,0.5)+S('rec','Record',0,5,0.5)+S('win','Recent window (weeks)',2,5,1)+'</div></div>'
   +'<div class="note">The Old # column on the rankings tab shows the original formula: ordinal ranks for record (up to 3x), all-play wins, consistency (from week 3) and PPG, without roster strength.</div></div>';
}
function vData(){
  var T=state.teams, h='<div class="panel dt"><div class="tools"><button class="btn pri" id="addBtn">Add team</button><button class="btn" id="exportBtn">Show data as text</button><button class="btn" id="resetBtn">Reset to published data</button><span class="sub">Edits save in this browser only. Send updates to Claude to publish them for everyone.</span></div>'
   +'<div class="p" style="padding-bottom:8px">Enter points and pick the opponent each week. Results, records and points against are worked out from the scores. Choosing an opponent sets the matching opponent for the other team too.</div><div class="scroll"><table><thead><tr><th>Team</th>';
  for (var k=0;k<WEEKS;k++) h+='<th class="n">W'+(k+1)+'</th>'; h+='<th></th></tr></thead><tbody>';
  T.forEach(function(t,i){
    h+='<tr><td><input type="text" class="nm" data-k="name" data-i="'+i+'" value="'+esc(t.name)+'" aria-label="Team name"></td>';
    for (var q=0;q<WEEKS;q++){
      h+='<td><input type="number" step="0.01" data-k="sc" data-i="'+i+'" data-w="'+q+'" value="'+(num(t.scores[q])===null?'':t.scores[q])+'" aria-label="Week '+(q+1)+' points"><select data-k="opp" data-i="'+i+'" data-w="'+q+'" aria-label="Week '+(q+1)+' opponent"><option value="">\u2013</option>'
        +T.map(function(o){ return o.id===t.id?'':'<option value="'+o.id+'"'+(t.opp[q]===o.id?' selected':'')+'>'+esc(short(o.name))+'</option>'; }).join('')+'</select></td>';
    }
    h+='<td><button class="btn" data-del="'+i+'">Remove</button></td></tr>';
  });
  return h+'</tbody></table></div><textarea id="exportBox" hidden readonly></textarea></div>';
}

/* ---------- shell ---------- */
function render(keepData){
  var _y=window.scrollY;
  cache={}; var last=lastWeek(); if(!asof||asof>last) asof=last;
  renderChips(); renderPodium(asof);
  document.getElementById('tabs').innerHTML=TABS.map(function(t){ return '<button role="tab" data-tab="'+t[0]+'" aria-selected="'+(tab===t[0])+'">'+t[1]+'</button>'; }).join('');
  var v=document.getElementById('view');
  if (tab==='data'){ if(!keepData) v.innerHTML=vData(); return; }
  v.innerHTML = tab==='rank'?vRank(asof):tab==='match'?vMatch(asof):tab==='trend'?vTrend(asof):tab==='outlook'?vOutlook(asof):tab==='comm'?vComm():tab==='scores'?vScores(asof):vMethod();
  window.scrollTo(0,_y);
}
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-wk]'); if(el){ asof=Number(el.getAttribute('data-wk')); render(false); return; }
  el=e.target.closest('[data-tab]'); if(el){ tab=el.getAttribute('data-tab'); render(false); return; }
  el=e.target.closest('[data-tm]'); if(el){ trendMode=el.getAttribute('data-tm'); render(false); return; }
  el=e.target.closest('[data-t]'); if(el){ var i=Number(el.getAttribute('data-t')); hl=hl===i?null:i; render(false); return; }
  if(e.target.id==='wReset'){ state.w=JSON.parse(JSON.stringify(DEF_W)); save(); render(false); return; }
});
document.addEventListener('input',function(e){
  var el=e.target, k=el.getAttribute('data-w'); if(!k||el.type!=='range') return;
  state.w[k]=Number(el.value); document.getElementById('v_'+k).textContent=el.value; save(); cache={};
});
document.addEventListener('change',function(e){ if(e.target.type==='range' && tab==='outlook') render(false); });
render(false);
</script>
</body>
